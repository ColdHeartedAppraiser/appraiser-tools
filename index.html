<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GA Appraisals — Appraiser Tools</title>
<style>
:root {
  --bg: #f5f4f1;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: #e0ddd6;
  --border2: #c8c4bb;
  --text: #1c1b18;
  --text2: #58564f;
  --text3: #98958d;
  --accent: #1a5fa8;
  --accent-bg: #edf3fb;
  --accent-border: #b8d0ef;
  --success: #2a7a4e;
  --success-bg: #edf7f2;
  --success-border: #9dd0b5;
  --warn-bg: #fdf5e8;
  --warn-text: #7a5200;
  --warn-border: #e8c97a;
  --error-bg: #fdf0f0;
  --error-text: #a02020;
  --error-border: #e8aaaa;
  --radius: 7px;
  --radius-lg: 11px;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13.5px; line-height: 1.5; }

/* LAYOUT */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 220px; min-width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.content { flex: 1; padding: 2rem 2.5rem; max-width: 840px; min-width: 0; }

/* SIDEBAR */
.sb-header { padding: 1.1rem 1rem 0.9rem; border-bottom: 1px solid var(--border); }
.sb-logo { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: 2px; }
.sb-title { font-size: 14px; font-weight: 600; color: var(--text); }
.sb-cat { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .09em; text-transform: uppercase; padding: 12px 12px 4px; }
.sb-item { font-size: 12.5px; color: var(--text2); padding: 6px 12px 6px 14px; cursor: pointer; border-left: 2px solid transparent; display: flex; align-items: center; gap: 6px; line-height: 1.3; }
.sb-item:hover { color: var(--text); background: var(--surface2); }
.sb-item.active { color: var(--accent); font-weight: 600; border-left-color: var(--accent); background: var(--accent-bg); }
.sb-badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
.sb-badge.pdf { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }

/* FORMS */
.page-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-desc { font-size: 13px; color: var(--text2); margin-bottom: 1.2rem; line-height: 1.6; }
.how-box { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: var(--radius); padding: 10px 13px; font-size: 12.5px; color: var(--text2); line-height: 1.6; margin-bottom: 1.1rem; }
.section-label { font-size: 10.5px; font-weight: 700; color: var(--text3); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px; margin-top: 1.2rem; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fg { display: flex; flex-direction: column; gap: 3px; }
.fg.full { grid-column: 1 / -1; }
label { font-size: 11.5px; color: var(--text2); }
input[type=text], textarea, select {
  font-family: var(--sans); font-size: 12.5px; width: 100%;
  padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); outline: none; transition: border-color .15s;
}
input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 50px; line-height: 1.5; }
hr { border: none; border-top: 1px solid var(--border); margin: 1.2rem 0; }

/* GENERATE BUTTON */
.gen-btn {
  font-family: var(--sans); font-size: 13px; font-weight: 600;
  padding: 9px 20px; cursor: pointer; border-radius: var(--radius);
  border: none; background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background .15s, transform .1s;
}
.gen-btn:hover { background: #154d8a; }
.gen-btn:active { transform: scale(0.98); }
.gen-btn:disabled { background: var(--border2); cursor: not-allowed; transform: none; }
.gen-btn .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
.gen-btn.loading .spinner { display: block; }
.gen-btn.loading .btn-text { opacity: .7; }
@keyframes spin { to { transform: rotate(360deg); } }

/* OUTPUT BOX */
.output-wrap { margin-top: 1rem; }
.output-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.output-label { font-size: 10.5px; font-weight: 700; color: var(--text3); letter-spacing: .09em; text-transform: uppercase; }
.copy-btn {
  font-family: var(--sans); font-size: 12px; padding: 4px 12px;
  cursor: pointer; border-radius: var(--radius); border: 1px solid var(--border2);
  background: var(--surface); color: var(--text2); font-weight: 500; transition: all .15s;
}
.copy-btn:hover { background: var(--surface2); }
.copy-btn.ok { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }
.output-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  font-size: 13.5px; color: var(--text); line-height: 1.8;
  min-height: 80px; white-space: pre-wrap; word-break: break-word;
}
.output-box.empty { color: var(--text3); font-style: italic; font-size: 13px; }
.output-box.error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); font-style: italic; }

/* PDF UPLOAD */
.pdf-upload-area {
  border: 2px dashed var(--border2); border-radius: var(--radius-lg);
  padding: 1.5rem; text-align: center; cursor: pointer;
  background: var(--surface2); transition: border-color .15s, background .15s;
  margin-bottom: 1rem;
}
.pdf-upload-area:hover, .pdf-upload-area.drag { border-color: var(--accent); background: var(--accent-bg); }
.pdf-upload-area.has-file { border-color: var(--success); background: var(--success-bg); }
.pdf-upload-label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }
.pdf-upload-sub { font-size: 11.5px; color: var(--text3); }
.pdf-upload-name { font-size: 12.5px; color: var(--success); font-weight: 600; margin-top: 6px; display: none; }
input[type=file] { display: none; }

/* TEST CARDS */
.test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.test-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.test-num { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; }
.test-name { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 1px; }
.conc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.conc-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
.conc-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* HBU CITY SELECTOR */
.city-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.city-list { max-height: 190px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-top: 4px; }
.region-hdr { font-size: 10px; font-weight: 700; color: var(--text3); padding: 6px 10px 3px; letter-spacing: .07em; text-transform: uppercase; background: var(--surface2); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.city-item { font-size: 12.5px; padding: 5px 10px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.city-item:last-child { border-bottom: none; }
.city-item:hover { background: var(--surface2); color: var(--text); }
.city-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.uninc-badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }

/* LINKS BOX */
.links-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 1rem; }
.links-title { font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
.link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 6px; }
.lnk { font-size: 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--accent); text-decoration: none; display: block; line-height: 1.35; background: var(--surface); transition: all .15s; }
.lnk:hover { background: var(--accent-bg); border-color: var(--accent-border); }
.lnk-label { font-weight: 600; display: block; }
.lnk-sub { font-size: 10.5px; color: var(--text3); display: block; margin-top: 1px; }
.no-city { font-size: 12.5px; color: var(--text3); font-style: italic; }
.ac-item { font-size:13px; padding:8px 12px; cursor:pointer; color:var(--text); border-bottom:0.5px solid var(--color-border-tertiary,var(--border)); line-height:1.4; }
.ac-item:hover { background:var(--accent-bg); }
.ac-item:last-child { border-bottom:none; }
.ac-main { font-weight:500; display:block; }
.ac-sub { font-size:11.5px; color:var(--text2); display:block; margin-top:1px; }
.z-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; }
.z-chip-label { display: block; font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
.z-chip-val { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; }

/* WELCOME */
.welcome h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.welcome p { font-size: 13.5px; color: var(--text2); line-height: 1.7; margin-bottom: 8px; }
.welcome ul { padding-left: 1.3rem; color: var(--text2); font-size: 13.5px; line-height: 2.1; }
.welcome a { color: var(--accent); }
.step-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
.step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.step-num { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.step-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.step-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
</style>
</head>

let currentView = 'welcome';
let fieldVals = {};
let selectedCity = null;
let hbuFieldVals = {};
let pdfBase64 = null;
let pdfFileName = null;

// ─── API CALL ────────────────────────────────────────────────────────────────

async function callClaude(systemPrompt, userPrompt, pdfData) {
  const resp = await fetch('/.netlify/functions/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ systemPrompt, userPrompt, pdfBase64: pdfData || null })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'API error');
  return data.text;
}

// ─── UI HELPERS ──────────────────────────────────────────────────────────────

function setOutput(boxId, text, state) {
  const b = document.getElementById(boxId);
  if (!b) return;
  b.className = 'output-box' + (state==='empty'?' empty':state==='error'?' error':'');
  b.textContent = text;
}

function setCopyBtn(btnId, text) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.textContent = text;
  if (text === 'Copied!') { btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('ok'); }, 2200); }
}

function setGenerating(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (loading) { btn.disabled=true; btn.classList.add('loading'); btn.querySelector('.btn-text').textContent='Generating…'; }
  else { btn.disabled=false; btn.classList.remove('loading'); btn.querySelector('.btn-text').textContent='Generate'; }
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────

function buildSidebar() {
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = '';
  const cats = [...new Set(TEMPLATES.map(t=>t.cat))];
  cats.forEach(cat => {
    const h = document.createElement('div'); h.className='sb-cat'; h.textContent=cat; nav.appendChild(h);
    TEMPLATES.filter(t=>t.cat===cat).forEach(t => {
      const el = document.createElement('div');
      el.className = 'sb-item' + (currentView===t.id?' active':'');
      const badge = t.type==='pdf' ? '<span class="sb-badge pdf">PDF</span>' : '';
      el.innerHTML = t.label + badge;
      el.onclick = () => { currentView=t.id; fieldVals={}; pdfBase64=null; pdfFileName=null; buildSidebar(); renderContent(); };
      nav.appendChild(el);
    });
  });
  const hbuH = document.createElement('div'); hbuH.className='sb-cat'; hbuH.textContent='HBU Tool'; nav.appendChild(hbuH);
  const hbuEl = document.createElement('div');
  hbuEl.className = 'sb-item' + (currentView==='hbu'?' active':'');
  hbuEl.textContent = 'HBU Research & Analysis';
  hbuEl.onclick = () => { currentView='hbu'; hbuFieldVals={}; selectedCity=null; buildSidebar(); renderContent(); };
  nav.appendChild(hbuEl);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function renderContent() {
  const el = document.getElementById('content');
  if (currentView==='welcome') { renderWelcome(el); return; }
  if (currentView==='hbu') { renderHBU(el); return; }
  const tmpl = TEMPLATES.find(t=>t.id===currentView);
  if (tmpl) tmpl.type==='pdf' ? renderPDFTemplate(el,tmpl) : renderFieldTemplate(el,tmpl);
}

function renderWelcome(el) {
  el.innerHTML = `
<div class="welcome">
  <h2>GA Appraisals — Appraiser Tools</h2>
  <p>Select a tool from the sidebar. Fill in your assignment data, click <strong>Generate</strong>, and copy the output directly into Total.</p>
  <p>PDF tools require exporting the relevant pages from Total as a PDF and attaching them here.</p>
  <div class="step-row">
    <div class="step-card"><div class="step-num">Step 1</div><div class="step-title">Select a tool</div><div class="step-desc">Choose from the narrative templates or the HBU tool in the sidebar.</div></div>
    <div class="step-card"><div class="step-num">Step 2</div><div class="step-title">Fill in data</div><div class="step-desc">Enter your assignment-specific information in the fields provided.</div></div>
    <div class="step-card"><div class="step-num">Step 3</div><div class="step-title">Generate</div><div class="step-desc">Click Generate. The paragraph appears in seconds, ready to copy into Total.</div></div>
    <div class="step-card"><div class="step-num">Step 4</div><div class="step-title">Copy into Total</div><div class="step-desc">Click Copy and paste directly into the appropriate section of your report.</div></div>
  </div>
</div>`;
}

function renderFieldTemplate(el, t) {
  let html = `<div class="page-title">${t.label}</div><div class="page-desc">${t.desc}</div>`;
  html += `<div class="section-label">Assignment data</div><div class="fgrid">`;
  t.fields.forEach(f => {
    html += `<div class="fg${f.full?' full':''}"><label>${f.label}</label><input type="text" id="fi_${f.id}" placeholder="${f.ph||''}" value="${fieldVals[f.id]||''}"></div>`;
  });
  html += `</div><hr>
  <button class="gen-btn" id="gen-btn" onclick="runFieldGenerate('${t.id}')">
    <div class="spinner"></div><span class="btn-text">Generate</span>
  </button>
  <div class="output-wrap">
    <div class="output-header">
      <span class="output-label">Generated narrative</span>
      <button class="copy-btn" id="copy-btn" onclick="copyOutput('output-box')">Copy</button>
    </div>
    <div class="output-box empty" id="output-box">Click Generate to produce the narrative.</div>
  </div>`;
  el.innerHTML = html;
  t.fields.forEach(f => {
    const i = document.getElementById('fi_'+f.id);
    if (i) i.addEventListener('input', () => { fieldVals[f.id]=i.value; });
  });
}

function renderPDFTemplate(el, t) {
  let html = `<div class="page-title">${t.label}</div><div class="page-desc">${t.desc}</div>`;
  html += `<div class="how-box"><strong>How to use:</strong> ${t.how}</div>`;
  html += `<label class="pdf-upload-area" id="pdf-drop-area" for="pdf-file-input">
    <input type="file" id="pdf-file-input" accept="application/pdf" onchange="handlePDFUpload(event)">
    <span class="pdf-upload-label" id="pdf-upload-label">Click to attach PDF — or drag and drop</span>
    <span class="pdf-upload-sub">Exported from Total appraisal software</span>
    <span class="pdf-upload-name" id="pdf-upload-name"></span>
  </label>
  <button class="gen-btn" id="gen-btn" onclick="runPDFGenerate('${t.id}')">
    <div class="spinner"></div><span class="btn-text">Generate</span>
  </button>
  <div class="output-wrap">
    <div class="output-header">
      <span class="output-label">Generated narrative</span>
      <button class="copy-btn" id="copy-btn" onclick="copyOutput('output-box')">Copy</button>
    </div>
    <div class="output-box empty" id="output-box">Attach a PDF and click Generate to produce the narrative.</div>
  </div>`;
  el.innerHTML = html;

  if (pdfFileName) {
    document.getElementById('pdf-upload-area').classList.add('has-file');
    document.getElementById('pdf-upload-name').style.display='block';
    document.getElementById('pdf-upload-name').textContent = pdfFileName;
    document.getElementById('pdf-upload-label').textContent = 'PDF attached';
  }

  const drop = document.getElementById('pdf-drop-area');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); if(e.dataTransfer.files[0]) handlePDFFile(e.dataTransfer.files[0]); });
}

function handlePDFUpload(e) { if(e.target.files[0]) handlePDFFile(e.target.files[0]); }
function handlePDFFile(file) {
  if (file.type !== 'application/pdf') { alert('Please upload a PDF file.'); return; }
  pdfFileName = file.name;
  const reader = new FileReader();
  reader.onload = r => {
    pdfBase64 = r.result.split(',')[1];
    const area = document.getElementById('pdf-upload-area');
    if(area) {
      area.classList.add('has-file');
      document.getElementById('pdf-upload-label').textContent = 'PDF attached';
      document.getElementById('pdf-upload-name').style.display = 'block';
      document.getElementById('pdf-upload-name').textContent = file.name;
    }
  };
  reader.readAsDataURL(file);
}

async function runFieldGenerate(tid) {
  const t = TEMPLATES.find(x=>x.id===tid);
  t.fields.forEach(f => { const i=document.getElementById('fi_'+f.id); if(i) fieldVals[f.id]=i.value; });
  setGenerating('gen-btn', true);
  setOutput('output-box','Generating…','empty');
  try {
    const result = await callClaude(t.systemPrompt, t.userPrompt(fieldVals), null);
    setOutput('output-box', result, 'done');
  } catch(e) {
    setOutput('output-box', 'Error: ' + e.message, 'error');
  }
  setGenerating('gen-btn', false);
}

async function runPDFGenerate(tid) {
  const t = TEMPLATES.find(x=>x.id===tid);
  if (!pdfBase64) { alert('Please attach a PDF first.'); return; }
  setGenerating('gen-btn', true);
  setOutput('output-box','Generating…','empty');
  try {
    const result = await callClaude(t.systemPrompt, t.userPrompt(), pdfBase64);
    setOutput('output-box', result, 'done');
  } catch(e) {
    setOutput('output-box', 'Error: ' + e.message, 'error');
  }
  setGenerating('gen-btn', false);
}

function copyOutput(boxId) {
  const b = document.getElementById(boxId);
  if (!b || b.classList.contains('empty') || b.classList.contains('error')) return;
  navigator.clipboard.writeText(b.textContent).then(() => setCopyBtn('copy-btn','Copied!'));
}

async function runZoningLookup() {
  const address = g('h_address');
  if (!address.trim()) { alert('Please enter a property address first.'); return; }
  
  const btn = document.getElementById('lookup-btn');
  btn.disabled = true; btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent = 'Looking up…';

  const resultBox = document.getElementById('lookup-result-box');
  resultBox.style.display = 'none';

  try {
    const resp = await fetch('/.netlify/functions/zoning-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address })
    });
    const data = await resp.json();

    if (!resp.ok || !data.success) {
      showLookupResult('error', data.error || 'Lookup failed. Please check the address and try again.');
      return;
    }

    // Populate fields
    const h = data.hbu;
    if (h.zoning)    { const el=document.getElementById('h_zoning');    if(el){el.value=h.zoning;    hbuFieldVals.zoning=h.zoning;} }
    if (h.permitted) { const el=document.getElementById('h_permitted'); if(el){el.value=h.permitted; hbuFieldVals.permitted=h.permitted;} }
    if (h.physical)  { const el=document.getElementById('h_physical');  if(el){el.value=h.physical;  hbuFieldVals.physical=h.physical;} }
    if (h.feasible)  { const el=document.getElementById('h_feasible');  if(el){el.value=h.feasible;  hbuFieldVals.feasible=h.feasible;} }
    if (h.maxprod)   { const el=document.getElementById('h_maxprod');   if(el){el.value=h.maxprod;   hbuFieldVals.maxprod=h.maxprod;} }
    if (h.vacant)    { const el=document.getElementById('h_vacant');    if(el){el.value=h.vacant;    hbuFieldVals.vacant=h.vacant;} }
    if (h.improved)  { const el=document.getElementById('h_improved');  if(el){el.value=h.improved;  hbuFieldVals.improved=h.improved;} }

    // Show summary card
    const jLabel = data.jurisdiction === 'city_la' ? 'City of Los Angeles' : data.jurisdiction === 'uninc_la' ? 'Unincorporated LA County' : 'Other jurisdiction';
    const flags = data.flags && data.flags.length ? data.flags.map(f=>`<li>${f}</li>`).join('') : '<li>No special overlays detected</li>';
    const sb9text = data.sb9 || '—';
    
    showLookupResult('success', '', `
      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Zoning lookup result — ${data.address}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-bottom:10px">
        <div class="z-chip"><span class="z-chip-label">Jurisdiction</span><span class="z-chip-val">${jLabel}</span></div>
        <div class="z-chip"><span class="z-chip-label">Zone</span><span class="z-chip-val">${data.rawZone||'—'}</span></div>
        <div class="z-chip"><span class="z-chip-label">General plan</span><span class="z-chip-val">${data.generalPlan||'—'}</span></div>
        <div class="z-chip"><span class="z-chip-label">TOC tier</span><span class="z-chip-val">${data.tocTier||'None'}</span></div>
        <div class="z-chip"><span class="z-chip-label">HPOZ</span><span class="z-chip-val">${data.isHPOZ?'Yes — '+((data.hpoz&&(data.hpoz.HPOZ_NAME||data.hpoz.NAME))||'see ZIMAS'):'No'}</span></div>
        <div class="z-chip"><span class="z-chip-label">Fire zone</span><span class="z-chip-val">${data.fireZone||'Not designated'}</span></div>
        <div class="z-chip"><span class="z-chip-label">Hillside</span><span class="z-chip-val">${data.isHillside?'Yes':'No'}</span></div>
        <div class="z-chip"><span class="z-chip-label">SB9</span><span class="z-chip-val" style="font-size:10px">${sb9text}</span></div>
      </div>
      <div style="font-size:11.5px;color:var(--text2)"><strong>Flags:</strong><ul style="margin:4px 0 0 1.2rem;line-height:1.9">${flags}</ul></div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">Fields pre-populated below. Review and adjust before generating. Always verify against ZIMAS for LA City or ZNet for unincorporated areas.</div>
    `);

    // Auto-select city in sidebar if LA City
    if (data.jurisdiction === 'city_la') {
      selectedCity = REGIONS.flatMap(r=>r.cities).find(c=>c.id==='city_la') || null;
      filterCities(); renderLinks();
    } else if (data.jurisdiction === 'uninc_la') {
      selectedCity = REGIONS.flatMap(r=>r.cities).find(c=>c.id==='u_altadena') || null;
      filterCities(); renderLinks();
    }

  } catch(e) {
    showLookupResult('error', 'Network error: ' + e.message + '. Check your connection and try again.');
  } finally {
    btn.disabled=false; btn.classList.remove('loading');
    btn.querySelector('.btn-text').textContent='Look up zoning';
  }
}

function showLookupResult(type, message, html) {
  const box = document.getElementById('lookup-result-box');
  if (!box) return;
  box.style.display = 'block';
  if (type === 'error') {
    box.innerHTML = `<div style="background:var(--error-bg);border:1px solid var(--error-border);border-radius:var(--radius);padding:10px 13px;font-size:12.5px;color:var(--error-text)">${message}</div>`;
  } else {
    box.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px">${html}</div>`;
  }
}

function g(id){ return (document.getElementById(id)||{}).value||''; }

async function runHBUGenerate() {
  const cityName = selectedCity ? selectedCity.name : '[jurisdiction]';
  const systemPrompt = `You are a licensed real estate appraiser writing narrative for a non-lender appraisal report. Write only the requested paragraph with no preamble, no commentary, and no markdown.`;
  const userPrompt = `Write a highest and best use analysis using this data:

- Property: ${g('h_address')||'[address]'}${g('h_apn')?' (APN: '+g('h_apn')+')':''}
- Jurisdiction: ${cityName}
- Current use: ${g('h_currentuse')||'[current use]'}

Test 1 — Legally permissible:
  Zoning: ${g('h_zoning')||'[zoning]'}
  Permitted uses: ${g('h_permitted')||'[permitted uses]'}

Test 2 — Physically possible:
  Lot: ${g('h_lot')||'[lot]'}
  Conditions: ${g('h_physical')||'[conditions]'}

Test 3 — Financially feasible: ${g('h_feasible')||'[feasible uses]'}

Test 4 — Maximally productive: ${g('h_maxprod')||'[maximally productive]'}

HBU as if vacant: ${g('h_vacant')||'[vacant conclusion]'}
HBU as improved: ${g('h_improved')||'[improved conclusion]'}

Requirements: 200–250 words. Continuous paragraph prose only. Address all four tests for both as if vacant and as improved. Formal appraisal language. No first person.`;

  setGenerating('hbu-gen-btn', true);
  setOutput('hbu-output-box','Generating…','empty');
  try {
    const result = await callClaude(systemPrompt, userPrompt, null);
    setOutput('hbu-output-box', result, 'done');
  } catch(e) {
    setOutput('hbu-output-box', 'Error: ' + e.message, 'error');
  }
  setGenerating('hbu-gen-btn', false);
}

function filterCities() {
  const list = document.getElementById('city-list'); if(!list) return;
  const q = ((document.getElementById('city-search')||{}).value||'').toLowerCase().trim();
  list.innerHTML = '';
  REGIONS.forEach(r => {
    const matches = r.cities.filter(c => !q || c.name.toLowerCase().includes(q));
    if(!matches.length) return;
    const hdr = document.createElement('div'); hdr.className='region-hdr'; hdr.textContent=r.label; list.appendChild(hdr);
    matches.forEach(c => {
      const item = document.createElement('div');
      item.className = 'city-item' + (selectedCity&&selectedCity.id===c.id?' active':'');
      item.innerHTML = c.name + (c.uninc?` <span class="uninc-badge">Unincorp.</span>`:'');
      item.onclick = () => { selectedCity=c; filterCities(); renderLinks(); };
      list.appendChild(item);
    });
  });
}

function renderLinks() {
  const grid = document.getElementById('link-grid'); const title = document.getElementById('links-title');
  if(!grid) return;
  if(!selectedCity) { title.textContent='Research links — select a jurisdiction above'; grid.innerHTML='<span class="no-city">No jurisdiction selected.</span>'; return; }
  title.textContent = 'Research links — ' + selectedCity.name;
  grid.innerHTML = selectedCity.links.map(l => `<a class="lnk" href="${l.url}" target="_blank"><span class="lnk-label">${l.label}</span><span class="lnk-sub">${l.sub}</span></a>`).join('');
}


let acTimer = null;
let acResults = [];

async function handleAddressInput(val) {
  hbuFieldVals.address = val;
  const drop = document.getElementById('autocomplete-dropdown');
  if (!drop) return;
  if (!val || val.length < 4) { drop.style.display='none'; return; }
  clearTimeout(acTimer);
  acTimer = setTimeout(async () => {
    try {
      const resp = await fetch('/.netlify/functions/places-autocomplete', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ input: val })
      });
      const data = await resp.json();
      if (!data.predictions || !data.predictions.length) { drop.style.display='none'; return; }
      acResults = data.predictions;
      drop.innerHTML = data.predictions.map((p,i) =>
        `<div class="ac-item" onclick="selectAddress(${i})">
          <span class="ac-main">${p.structured_formatting?.main_text||p.description}</span>
          <span class="ac-sub">${p.structured_formatting?.secondary_text||''}</span>
        </div>`
      ).join('');
      drop.style.display = 'block';
    } catch(e) { drop.style.display='none'; }
  }, 280);
}

function selectAddress(idx) {
  const p = acResults[idx];
  if (!p) return;
  const addr = p.description;
  const input = document.getElementById('h_address');
  if (input) { input.value = addr; hbuFieldVals.address = addr; }
  const drop = document.getElementById('autocomplete-dropdown');
  if (drop) drop.style.display = 'none';
  runZoningLookup();
}

document.addEventListener('click', function(e) {
  const drop = document.getElementById('autocomplete-dropdown');
  if (drop && !drop.contains(e.target) && e.target.id !== 'h_address') {
    drop.style.display = 'none';
  }
});
